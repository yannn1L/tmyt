<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>That's my territory!</title>
    <script src="lib/pixi.min.js"></script>
    <style>
    @import url('lib/p2font.css');

        :root {
            --bg: #050508; --panel: rgba(17, 17, 26, 0.85);
            --text-neon: #00ffcc;
            --border-color: #2a2a3a; --font-pixel: 'Press Start 2P', monospace;
            --sim-scale: 1.0;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg); color: #fff;
            font-family: var(--font-pixel); height: 100vh; overflow: hidden; user-select: none;
            display: flex; justify-content: center; align-items: center;
            image-rendering: crisp-edges; image-rendering: pixelated;
        }

        .sim-panel { background: var(--panel); border: 1px solid var(--border-color); box-shadow: 0 0 15px rgba(0, 255, 204, 0.05), inset 0 0 20px rgba(0, 0, 0, 0.8); box-sizing: border-box; }
        #game-container { width: 320px; height: 320px; position: relative; overflow: hidden; border: 1px solid rgba(0, 255, 204, 0.2); box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0, 255, 204, 0.05); }
        .scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; padding: 12px; z-index: 10; }

        h1 { color: var(--text-neon); font-size: 14px; text-align: center; margin: 0 0 8px 0; text-shadow: var(--text-glow); line-height: 1.4; }
        .btn { background: rgba(0, 255, 204, 0.1); color: var(--text-neon); border: 1px solid var(--text-neon); padding: 10px 12px; font-size: 10px; cursor: pointer; text-shadow: var(--text-glow); box-shadow: inset 0 0 5px rgba(0,255,204,0.2); transition: all 0.1s; margin-top: 8px; width: 100%; text-align: center; font-family: inherit; }
        .btn:hover:not(:disabled) { background: var(--text-neon); color: #000; box-shadow: 0 0 15px var(--text-neon); }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn:disabled { color: #555; border-color: #333; background: transparent; text-shadow: none; box-shadow: none; cursor: not-allowed; }
        .subtitle { font-size: 8px; color: #888; margin-bottom: 10px; text-align: center; line-height: 1.5; }

        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); } ::-webkit-scrollbar-thumb { background: rgba(0, 255, 204, 0.3); border-radius: 2px; } ::-webkit-scrollbar-thumb:hover { background: rgba(0, 255, 204, 0.6); }

        .unit-list { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; overflow-y: auto; max-height: 205px; padding-right: 4px; align-items: start; }
        .unit-item { background: rgba(0, 0, 0, 0.5); padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; border: 1px solid var(--border-color); border-top: 2px solid var(--border-color); transition: all 0.1s; border-radius: 4px; height: 100%; box-sizing: border-box; }
        .unit-item:hover { background: rgba(255, 255, 255, 0.05); }
        .unit-item.selected { border-color: var(--text-neon); border-top-width: 3px; background: rgba(0, 255, 204, 0.08); box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.15); }

        .unit-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
        .unit-emote { font-size: 14px; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.8)); margin-right: 4px; }

        .unit-title-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
        .unit-name { font-size: 7px; text-shadow: 1px 1px 0 #000; letter-spacing: 0.5px; }
        .unit-stats { font-size: 6px; }
        .unit-skill-badge { align-self: flex-start; font-size: 5px; padding: 3px 4px; border-radius: 2px; letter-spacing: 0.5px; text-transform: uppercase; }
        .unit-desc-long { font-size: 1px; color: #bbb; line-height: 1.4; }

        #loading-bar { width: 100%; height: 8px; border: 1px solid var(--border-color); margin-top: 15px; background: rgba(0,0,0,0.5); }
        #loading-fill { width: 0%; height: 100%; background: var(--text-neon); box-shadow: var(--text-glow); transition: width 0.1s; }

        .hud-corner { position: absolute; width: 8px; height: 8px; border-color: var(--text-neon); border-style: solid; z-index: 5; pointer-events: none; }
        .top-left { top: -1px; left: -1px; border-width: 2px 0 0 2px; } .top-right { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
        .bottom-left { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; } .bottom-right { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

        #scene-simulation { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        #scene-simulation > * { pointer-events: auto; }

        #sim-wrapper {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(var(--sim-scale));
            transform-origin: center center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; width: 320px;
        }

        #sim-canvas-wrap { position: relative; width: 320px; height: 320px; padding: 0; box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,255,204,0.1); border: 1px solid rgba(0, 255, 204, 0.2); }
        #pixi-container canvas { display: block; width: 100%; height: 100%; }

        #sim-header { width: 100%; padding: 12px; text-align: center; border-top: 2px solid var(--text-neon); }
        #sim-header h1 { margin: 0; font-size: 12px; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; }

        #sim-footer { width: 100%; max-height: 180px; overflow-y: auto; padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: start; border-bottom: 2px solid var(--text-neon); }
        .stat-card { width: 92px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); padding: 4px 6px; display: flex; flex-direction: column; gap: 4px; border-radius: 4px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); box-sizing: border-box; transition: border-color 0.2s; }
        .stat-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 2px; }

        .stat-card-emote { font-size: 12px; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
        .stat-card-pct { font-size: 6px; text-shadow: 1px 1px 0 #000; }
        .stat-card-stats { font-size: 10px; display: flex; justify-content: space-between; margin-top: 2px; transform: scale(0.50); transform-origin: left top; width: 200%; }
        .stat-card-skill { font-size: 5px; text-align: center; background: rgba(255,255,255,0.08); border-radius: 2px; padding: 3px 0; letter-spacing: 0.5px; }
        .stat-card-desc-short { font-size: 10px; transform: scale(0.6); transform-origin: center center; width: 200%; margin-left: -50%; color: #aaa; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }

        #winner-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(5, 5, 8, 0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 30; }
        #winner-text { font-size: 16px; margin-bottom: 10px; text-align: center; line-height: 1.6; }
        .winnerPopAnim { animation: winnerPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes winnerPop { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2) rotate(-5deg); opacity: 1; } 75% { transform: scale(0.9) rotate(3deg); } 100% { transform: scale(1) rotate(0); } }

        #speedup-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 20px; color: #ffcc00; text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 0 0 20px #ffaa00;
            pointer-events: none; z-index: 25; opacity: 0; text-align: center; line-height: 1.4;
        }
        #speedup-overlay.show { animation: speedPop 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes speedPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.3) rotate(-5deg); opacity: 1; } 40% { transform: translate(-50%, -50%) scale(1) rotate(2deg); } 80% { transform: translate(-50%, -50%) scale(1) translateY(0); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5) translateY(-30px); opacity: 0; } }
    </style>
</head>
<body>

<div id="game-container" class="sim-panel">
    <div class="hud-corner top-left"></div><div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div><div class="hud-corner bottom-right"></div>
    <div id="scene-loading" class="scene">
        <h1>SYSTEM<br>BOOTING</h1><div class="subtitle" id="boot-status">Loading modules...</div>
        <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>
    <div id="scene-editor" class="scene" style="display: none;">
        <h1>EDITOR SCENE</h1><div class="subtitle">Select at least 3 classes to begin</div>
        <div class="unit-list" id="unit-selection"></div>
        <button class="btn" id="btn-start" disabled>INITIALIZE SIMULATION!</button>
    </div>
</div>

<div id="scene-simulation" style="display: none;">
    <div id="sim-wrapper">
        <div class="sim-panel" id="sim-header"><h1>THAT'S MY TERRITORY!</h1></div>

        <div class="sim-panel" id="sim-canvas-wrap">
            <div class="hud-corner top-left"></div><div class="hud-corner top-right"></div>
            <div class="hud-corner bottom-left"></div><div class="hud-corner bottom-right"></div>

            <div id="speedup-overlay">SPEED 2X!</div>
            <div id="pixi-container" style="width: 100%; height: 100%;"></div>
            <div id="winner-overlay"><h1 id="winner-text">WINNER!</h1></div>
        </div>

        <div class="sim-panel" id="sim-footer"></div>
    </div>
</div>

<!-- ====================================================================
     BLOB LOADER — fetch + inject serial with retry.
     Solusi anti-race untuk Android WebView / Spck Editor.

     Kenapa ini bekerja:
     - fetch() → ambil text → Blob → URL.createObjectURL → inject <script>
     - Serial (tunggu file 1 selesai sebelum file 2)
     - Retry 3x dengan exponential backoff
     - Timeout 10s per file
     - Blob URL tidak kena cache, tidak butuh server reliable
     ==================================================================== -->
<script>
(function() {
    'use strict';

    var FILES = [
        'data/ui-config.js',
        'data/sfx-data.js',
        'data/abilities.js', // ← Parts (harus sebelum factions)
        'data/factions.js', // ← Faction data
        'core/config.js',
        'core/audio.js',
        'core/vfx.js',
        'core/faction-registry.js', // ← BARU: Compiler + Registry
        'core/worldstate.js',
        'core/renderer.js',
        'core/engine.js',
        'core/main.js'
    ];

    var MAX_RETRIES = 3;
    var TIMEOUT_MS = 10000;
    var loaded = [];

    var statusEl = document.getElementById('boot-status');
    var fillEl = document.getElementById('loading-fill');

    function setStatus(msg) {
        if (statusEl) statusEl.textContent = msg;
    }

    function setProgress(pct) {
        if (fillEl) fillEl.style.width = pct + '%';
    }

    /**
     * Fetch a script file with timeout + retry.
     * Returns Promise<string> (script source text).
     */
    function fetchScript(src, retriesLeft) {
        return new Promise(function(resolve, reject) {
            var timedOut = false;
            var timeoutHandle = setTimeout(function() {
                timedOut = true;
                handleError(new Error('Timeout after ' + TIMEOUT_MS + 'ms'));
            }, TIMEOUT_MS);

            function handleError(err) {
                clearTimeout(timeoutHandle);
                if (retriesLeft > 0 && !timedOut) {
                    var waitMs = 150 * (MAX_RETRIES - retriesLeft + 1);
                    console.warn('[LOADER] Retry (' + retriesLeft + ') ' + src + ' in ' + waitMs + 'ms');
                    setTimeout(function() {
                        fetchScript(src, retriesLeft - 1).then(resolve, reject);
                    }, waitMs);
                } else {
                    reject(new Error('Failed to load ' + src + ': ' + err.message));
                }
            }

            // Use fetch with cache: 'no-store' to bypass cache issues
            fetch(src, { cache: 'no-store' })
                .then(function(resp) {
                    if (!resp.ok) {
                        throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
                    }
                    return resp.text();
                })
                .then(function(text) {
                    clearTimeout(timeoutHandle);
                    if (!text || text.length < 10) {
                        throw new Error('Empty/too-short response (' + (text ? text.length : 0) + ' bytes)');
                    }
                    resolve(text);
                })
                .catch(function(err) {
                    if (timedOut) return; // already handled
                    handleError(err);
                });
        });
    }

    /**
     * Inject script source via Blob URL.
     * This bypasses file:// cache, MIME sniffing issues, etc.
     */
    function injectScript(src, sourceText) {
        return new Promise(function(resolve, reject) {
            try {
                var blob = new Blob([sourceText], { type: 'application/javascript' });
                var url = URL.createObjectURL(blob);
                var script = document.createElement('script');
                script.src = url;
                script.async = false;

                script.onload = function() {
                    URL.revokeObjectURL(url);
                    resolve(src);
                };
                script.onerror = function() {
                    URL.revokeObjectURL(url);
                    reject(new Error('Runtime error in ' + src));
                };

                document.head.appendChild(script);
            } catch (e) {
                reject(e);
            }
        });
    }

    async function loadAll() {
        var total = FILES.length;
        setStatus('Loading 0/' + total);

        for (var i = 0; i < total; i++) {
            var f = FILES[i];
            setStatus('Loading ' + (i + 1) + '/' + total + ': ' + f.split('/').pop());
            setProgress((i / total) * 100);

            try {
                var text = await fetchScript(f, MAX_RETRIES);
                await injectScript(f, text);
                loaded.push(f);
                console.log('[LOADER] ✓ ' + (i + 1) + '/' + total + ' ' + f);
            } catch (e) {
                console.error('[LOADER] ✗ FATAL: ' + f);
                console.error('  ' + e.message);
                showFatalError(f, e);
                return;
            }
        }

        setStatus('Ready!');
        setProgress(100);
        console.log('[LOADER] All ' + total + ' files loaded.');
        // main.js auto-boots itself (DOMContentLoaded or immediate)
    }

    function showFatalError(file, err) {
        var container = document.getElementById('scene-loading');
        if (container) {
            container.innerHTML =
                '<h1 style="color:#ff2a2a;">LOAD ERROR</h1>' +
                '<div class="subtitle" style="color:#ff8888;">' +
                    'File: ' + file + '<br><br>' +
                    err.message + '<br><br>' +
                    'Loaded: ' + loaded.length + '/' + FILES.length +
                '</div>' +
                '<button class="btn" onclick="location.reload()">RETRY</button>';
        }
        console.error('[LOADER FATAL]', file, err);
    }

    // Start loading after DOM ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadAll);
    } else {
        loadAll();
    }
})();
</script>

</body>
</html>
